services:
  - type: web
    name: ilmexchange-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npx tsx server.ts
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_USER
        value: vinothofficial14@gmail.com
      - key: SMTP_APP_PASSWORD
        sync: false
